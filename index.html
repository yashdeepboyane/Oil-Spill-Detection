<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>OceanGuard — Marine Oil Spill Detection & Age Tracker</title>
    <meta name="description" content="OceanGuard: Satellite SAR Oil Spill Detection, AIS Vessel Tracking, Drift Forecasting & Spill Age Interval Estimation." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script type="module" crossorigin src="/assets/index.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
      .leaflet-container {
        background-color: #021220 !important;
      }
      .og-satellite-tiles {
        filter: brightness(1.04) contrast(1.08) saturate(1.15);
      }
      .leaflet-popup-content-wrapper {
        border-radius: 12px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      }
      .og-spill-tooltip {
        background: rgba(15, 23, 42, 0.92) !important;
        border: 1px solid #ef4444 !important;
        color: #ffffff !important;
        font-family: ui-monospace, SFMono-Regular, monospace !important;
        font-size: 10px !important;
        border-radius: 6px !important;
        padding: 4px 8px !important;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3) !important;
      }
      .og-spill-tooltip:before {
        border-top-color: #ef4444 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/assets/ai-bridge.js"></script>
    <script src="/assets/live-map.js"></script>
  </body>
</html>
